---
- name: Install Clickhouse
  hosts: clickhouse
  handlers:
    - name: Start clickhouse service
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted
  tasks:
    - name: Download Clickhouse
      block:
        - name: Get clickhouse distrib
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/rpm/stable/{{ item }}-{{ clickhouse_version }}.noarch.rpm"
            dest: "./{{ item }}-{{ clickhouse_version }}.rpm"
            mode: "0644"
          with_items: "{{ clickhouse_packages }}"
      rescue:
        - name: Get clickhouse distrib alternative
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/rpm/stable/clickhouse-common-static-{{ clickhouse_version }}.x86_64.rpm"
            dest: "./clickhouse-common-static-{{ clickhouse_version }}.rpm"
            mode: "0644"

    - name: Install clickhouse packages
      become: true
      ansible.builtin.yum:
        name:
          - "clickhouse-common-static-{{ clickhouse_version }}.rpm"
          - "clickhouse-client-{{ clickhouse_version }}.rpm"
          - "clickhouse-server-{{ clickhouse_version }}.rpm"
      notify: Start clickhouse service

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Create database
      ansible.builtin.command: "clickhouse-client -q 'create database logs;'"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc != 82
      changed_when: create_db.rc == 0

- name: Install and configure Vector
  hosts: vector
  become: true
  vars:
    vector_version: "0.34.0"
    vector_config_dir: "/etc/vector"
  handlers:
    - name: Restart vector service
      ansible.builtin.service:
        name: vector
        state: restarted
  tasks:
    - name: Create vector config directory
      ansible.builtin.file:
        path: "{{ vector_config_dir }}"
        state: directory
        mode: "0755"

    - name: Download Vector archive
      ansible.builtin.get_url:
        url: "https://github.com{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-musl.tar.gz"
        dest: "/tmp/vector-{{ vector_version }}.tar.gz"
        mode: "0644"

    - name: Unarchive Vector
      ansible.builtin.unarchive:
        src: "/tmp/vector-{{ vector_version }}.tar.gz"
        dest: "/tmp"
        remote_src: true
        creates: "/tmp/vector-x86_64-unknown-linux-musl"

    - name: Install Vector binary
      ansible.builtin.copy:
        src: "/tmp/vector-x86_64-unknown-linux-musl/bin/vector"
        dest: "/usr/local/bin/vector"
        mode: "0755"
        remote_src: true

    - name: Deploy Vector systemd unit
      ansible.builtin.copy:
        src: "/tmp/vector-x86_64-unknown-linux-musl/config/systemd/vector.service"
        dest: "/etc/systemd/system/vector.service"
        mode: "0644"
        remote_src: true
      notify: Restart vector service

    - name: Configure Vector from template
      ansible.builtin.template:
        src: templates/vector.toml.j2
        dest: "{{ vector_config_dir }}/vector.toml"
        mode: "0644"
      notify: Restart vector service

    - name: Ensure Vector service is started and enabled
      ansible.builtin.service:
        name: vector
        state: started
        enabled: true
